name: Update Website from CV

on:
  push:
    paths:
      - "cv/Sangay Wangchuk CV (complete).docx"
      - ".github/workflows/update-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cv-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx

      - name: Extract CV data
        run: |
          python scripts/extract_cv.py

      - name: Commit updated CV data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cv/

          if git diff --cached --quiet; then
            echo "No CV data changes detected."
          else
            git commit -m "Auto-update website data from CV"
            git push
          fi
